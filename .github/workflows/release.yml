name: Release

on:
  schedule:
    - cron: "0 3 * * *" # denní RC
    - cron: "30 3 * * *" # denní staging build
    - cron: "0 4 * * 1" # pondělní povýšení RC na stabilní verzi
  workflow_dispatch:
    inputs:
      mode:
        description: rc = nový release candidate, staging = jen staging DMG, promote = povýšit RC na stabilní verzi
        type: choice
        options: [rc, staging, promote]
        default: rc
      min_age_days:
        description: Minimální stáří RC pro promote (0 = hotfix hned)
        default: "7"

permissions:
  contents: read

# Staging běží nezávisle; rc a promote se nesmí míjet kvůli číslování verzí.
concurrency:
  group: ${{ (inputs.mode == 'staging' || github.event.schedule == '30 3 * * *') && 'release-staging' || 'release' }}
  cancel-in-progress: false

jobs:
  plan:
    # Vydává se jen z main, i při ručním spuštění.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      rc_tag: ${{ steps.plan.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then mode="$INPUT_MODE"
          elif [ "$SCHEDULE" = "0 4 * * 1" ]; then mode=promote
          elif [ "$SCHEDULE" = "30 3 * * *" ]; then mode=staging
          else mode=rc; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          MIN_AGE: ${{ inputs.min_age_days || '7' }}
          # Plánovaný staging se přeskočí, pokud vydání už nese tenhle commit; ruční běh staví vždy.
          IF_CHANGED: ${{ github.event_name == 'schedule' && '--if-changed' || '' }}
        run: python3 scripts/release.py "$MODE" --head "$GITHUB_SHA" --min-age-days "$MIN_AGE" --notes release-notes.md $IF_CHANGED
      - if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.mode == 'rc'
    runs-on: macos-15
    # Notarizace u Applu může trvat i hodiny; 360 minut je strop GitHub runnerů.
    timeout-minutes: 360
    steps:
      # Build bere commit běhu (github.sha), ze kterého plan počítal verzi.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Self-testy počítají s češtinou jako jazykem systému.
      - run: defaults write -g AppleLanguages -array cs en
      - uses: ./.github/actions/signing-keychain
        with:
          p12: ${{ secrets.MACOS_CERT_P12 }}
          password: ${{ secrets.MACOS_CERT_PASSWORD }}
      # Cizí veřejný klíč v appce by odmítl každou aktualizaci.
      - env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: swift scripts/check-update-keys.swift
      - id: build
        env:
          SCREENSHOT_NOTE_FEED_URL: https://janprasil.github.io/screenshot-note/appcast.xml
          SCREENSHOT_NOTE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          SCREENSHOT_NOTE_VERSION: ${{ needs.plan.outputs.version }}
          SCREENSHOT_NOTE_BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -o pipefail
          ./build.sh | tee build.log
          echo "app=$(sed -n 's/^Vytvořeno: //p' build.log)" >> "$GITHUB_OUTPUT"
      # Název DMG je bez -rc, aby šel při povýšení použít beze změny.
      - env:
          APP: ${{ steps.build.outputs.app }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: 9NWSHFDN9T
        run: |
          mkdir dist
          scripts/package-dmg.sh "$APP" "dist/Screenshot-Note-$VERSION.dmg" "Screenshot Note"
          (cd dist && shasum -a 256 "Screenshot-Note-$VERSION.dmg" > "Screenshot-Note-$VERSION.dmg.sha256")
      - uses: ./.github/actions/sparkle-tools
      # Podpis aktualizace pro appcast, až po notarizaci a staple.
      - env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          dmg="dist/Screenshot-Note-$VERSION.dmg"
          signed=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | sign_update --ed-key-file - "$dmg")
          printf '%s' "$signed" | python3 scripts/appcast.py sparkle-meta "$dmg" "$VERSION" "$BUILD" > "$dmg.sparkle"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish-rc:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: gh release create "$TAG" dist/* -R "$REPO" --target "$SHA" --prerelease --title "Screenshot Note ${TAG#v}" --notes-file release-notes/release-notes.md

  # Staging je samostatný režim: vlastní build s testovacím originem, bez update feedu.
  staging:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.mode == 'staging'
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: defaults write -g AppleLanguages -array cs en
      - uses: ./.github/actions/signing-keychain
        with:
          p12: ${{ secrets.MACOS_CERT_P12 }}
          password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - id: build
        env:
          SCREENSHOT_NOTE_ENV: test
          SCREENSHOT_NOTE_WEB_ORIGIN: https://sn-staging.cfy.performance4.cz
          SCREENSHOT_NOTE_VERSION: ${{ needs.plan.outputs.version }}
          SCREENSHOT_NOTE_BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -o pipefail
          ./build.sh | tee build.log
          echo "app=$(sed -n 's/^Vytvořeno: //p' build.log)" >> "$GITHUB_OUTPUT"
      - env:
          APP: ${{ steps.build.outputs.app }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: 9NWSHFDN9T
        run: |
          mkdir staging
          scripts/package-dmg.sh "$APP" staging/Screenshot-Note-staging.dmg "Screenshot Note (staging)"
          (cd staging && shasum -a 256 Screenshot-Note-staging.dmg > Screenshot-Note-staging.dmg.sha256)
      # Průběžné vydání staging drží stálou URL; soubory se při každém běhu přepíšou.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          notes="Rolling staging build of $VERSION ($SHA). Web origin: https://sn-staging.cfy.performance4.cz. Signed with Developer ID and notarized."
          if gh release view staging -R "$REPO" >/dev/null 2>&1; then
            gh release upload staging staging/* -R "$REPO" --clobber
            gh release edit staging -R "$REPO" --prerelease --notes "$notes"
          else
            gh release create staging staging/* -R "$REPO" --target "$SHA" --prerelease --title "Screenshot Note staging" --notes "$notes"
          fi
      - if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # Po RC i povýšení se appcast sestaví znovu ze všech vydání.
  appcast:
    needs: [publish-rc, promote]
    if: always() && (needs.publish-rc.result == 'success' || needs.promote.result == 'success')
    uses: ./.github/workflows/appcast.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit

  promote:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      # Stabilní verze nese stejné binárky, jaké týden běžely jako RC.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          RC_TAG: ${{ needs.plan.outputs.rc_tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh release download "$RC_TAG" -R "$REPO" -D dist
          # Stálý název pro odkaz releases/latest/download/Screenshot-Note.dmg.
          cp dist/Screenshot-Note-*.dmg dist/Screenshot-Note.dmg
          (cd dist && shasum -a 256 Screenshot-Note.dmg > Screenshot-Note.dmg.sha256)
          gh release create "$TAG" dist/* -R "$REPO" --target "$SHA" --latest --title "Screenshot Note ${TAG#v}" --notes-file release-notes.md
