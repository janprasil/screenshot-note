name: Appcast

# Sestaví appcast z vydání, podepíše ho a nasadí na GitHub Pages.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: appcast
  cancel-in-progress: false

jobs:
  build:
    # sign_update existuje jen pro macOS.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/sparkle-tools
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::SPARKLE_ED_PRIVATE_KEY is not set"; exit 1; }
          mkdir site
          python3 scripts/appcast.py feed --repo "$REPO" --out site/appcast.xml
          # Appka vyžaduje podepsaný feed; po podpisu se soubor už nesmí měnit.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | sign_update --ed-key-file - site/appcast.xml
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | sign_update --verify --ed-key-file - site/appcast.xml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}appcast.xml
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
