name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql-${{ matrix.language }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Self-testy počítají s češtinou jako jazykem systému.
      - if: matrix.build-mode == 'manual'
        run: defaults write -g AppleLanguages -array cs en
      - if: matrix.build-mode == 'manual'
        run: ./build.sh
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
