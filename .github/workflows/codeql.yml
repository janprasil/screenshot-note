name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql-${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
            os: macos-15
          # Workflow soubory nepotřebují Mac runner.
          - language: actions
            build-mode: none
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Analýza potřebuje jen kompilaci; testy a balení .app běží v CI jobu build.
      - if: matrix.build-mode == 'manual'
        run: swift build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
